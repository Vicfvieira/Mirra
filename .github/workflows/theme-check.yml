name: Theme Check

on:
  push:
  pull_request:

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Shopify CLI
        run: npm install -g @shopify/cli@5
      - name: Rodar theme check (falha em erros)
        run: shopify theme check --path . --fail-level error

  json:
    name: JSON válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar templates, configurações e locales
        run: |
          python3 -c "
          import glob, json, re
          files = glob.glob('templates/*.json') + glob.glob('sections/*.json') + glob.glob('config/*.json') + glob.glob('locales/*.json')
          for p in files:
              src = re.sub(r'^\s*/\*.*?\*/', '', open(p, encoding='utf-8').read(), flags=re.S)
              json.loads(src)
          print(len(files), 'arquivos JSON ok')
          "
